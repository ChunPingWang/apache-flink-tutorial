# MySQL 8.0 部署 - CDC 來源資料庫
# 已啟用 Binlog (ROW format) 和 GTID，供 Flink CDC 使用
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: flink-lab
spec:
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: "rootpass"
            - name: MYSQL_DATABASE
              value: "inventory"
            - name: MYSQL_USER
              value: "flink"
            - name: MYSQL_PASSWORD
              value: "flinkpass"
          args:
            - --server-id=1
            - --log-bin=mysql-bin
            - --binlog-format=ROW
            - --binlog-row-image=FULL
            - --gtid-mode=ON
            - --enforce-gtid-consistency=ON
          ports:
            - containerPort: 3306
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: flink-lab
spec:
  selector:
    app: mysql
  ports:
    - port: 3306

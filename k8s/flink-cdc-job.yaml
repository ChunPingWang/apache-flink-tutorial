# Flink CDC Job 部署 - Kind 本地環境
apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
  name: order-cdc-job
  namespace: flink-lab
spec:
  image: apache/flink:1.19.0-scala_2.12-java17
  flinkVersion: v1_19
  flinkConfiguration:
    # Checkpoint
    execution.checkpointing.interval: "30s"
    execution.checkpointing.mode: EXACTLY_ONCE
    state.checkpoints.dir: s3a://flink-checkpoints/order-cdc
    state.savepoints.dir: s3a://flink-savepoints/order-cdc
    state.backend: rocksdb
    state.backend.incremental: "true"
    state.checkpoints.num-retained: "5"
    # S3 / MinIO
    fs.s3a.endpoint: http://minio.minio.svc.cluster.local:9000
    fs.s3a.access.key: minioadmin
    fs.s3a.secret.key: minioadmin123
    fs.s3a.path.style.access: "true"
    fs.s3a.connection.ssl.enabled: "false"
    # Metrics
    metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
    metrics.reporter.prom.port: "9249"
    # Restart
    restart-strategy: exponential-delay
    restart-strategy.exponential-delay.initial-backoff: 1s
    restart-strategy.exponential-delay.max-backoff: 5min
    restart-strategy.exponential-delay.backoff-multiplier: "2.0"
    # Parallelism
    taskmanager.numberOfTaskSlots: "2"
  serviceAccount: flink
  jobManager:
    resource:
      memory: "1024m"
      cpu: 0.5
    replicas: 1
  taskManager:
    resource:
      memory: "2048m"
      cpu: 1
    replicas: 2
  job:
    jarURI: local:///opt/flink/usrlib/flink-cdc-demo-1.0.0-SNAPSHOT.jar
    entryClass: com.example.flink.job.OrderCdcJob
    parallelism: 2
    upgradeMode: stateful
    state: running
  podTemplate:
    spec:
      containers:
        - name: flink-main-container
          env:
            - name: MYSQL_HOST
              value: "mysql.flink-lab.svc.cluster.local"
            - name: KAFKA_BROKERS
              value: "flink-kafka-kafka-brokers.kafka.svc.cluster.local:9092"
            - name: CHECKPOINT_DIR
              value: "s3a://flink-checkpoints/order-cdc"

# Flink CDC Job 部署 - AWS Outposts 環境
apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
  name: order-cdc-job
  namespace: flink-lab
spec:
  image: apache/flink:1.19.0-scala_2.12-java17
  flinkVersion: v1_19
  flinkConfiguration:
    # S3 on Outposts
    fs.s3a.endpoint: "https://s3-outposts.ap-northeast-1.amazonaws.com"
    fs.s3a.aws.credentials.provider: "com.amazonaws.auth.WebIdentityTokenFileCredentialsProvider"
    state.checkpoints.dir: "s3a://flink-checkpoints-outposts/checkpoints"
    state.savepoints.dir: "s3a://flink-checkpoints-outposts/savepoints"
    # State Backend
    state.backend: rocksdb
    state.backend.incremental: "true"
    execution.checkpointing.interval: "30s"
    execution.checkpointing.mode: EXACTLY_ONCE
    # Metrics
    metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
    metrics.reporter.prom.port: "9249"
  serviceAccount: flink  # 對應 IRSA 設定的 SA
  jobManager:
    resource:
      memory: "2048m"
      cpu: 1
    replicas: 1
  taskManager:
    resource:
      memory: "4096m"
      cpu: 2
    replicas: 2
  job:
    jarURI: local:///opt/flink/usrlib/flink-cdc-demo-1.0.0-SNAPSHOT.jar
    entryClass: com.example.flink.job.OrderCdcJob
    parallelism: 2
    upgradeMode: stateful
    state: running
  podTemplate:
    spec:
      serviceAccountName: flink
      containers:
        - name: flink-main-container
          env:
            - name: AWS_REGION
              value: "ap-northeast-1"
            - name: MYSQL_HOST
              value: "flink-mysql.cluster-xxxxxxxxx.ap-northeast-1.rds.amazonaws.com"
            - name: KAFKA_BROKERS
              value: "flink-kafka-bootstrap.kafka:9092"
